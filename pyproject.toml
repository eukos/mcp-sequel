[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-sequel"
version = "0.2.1rc1"
description = "MCP server for Claude that connects to MySQL, MariaDB, PostgreSQL, and SQLite databases"
readme = "README.md"
authors = [{ name = "Eugene Kosyakov", email = "eukos@yandex.by" }]
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
]
keywords = ["mcp", "mysql", "mariadb", "postgresql", "sqlite", "claude", "llm", "ai"]
dependencies = [
    "mcp[cli]>=1.0",
    "pymysql>=1.2",
    "sqlglot>=20.0",
    "pydantic>=2.0",
    "paramiko>=5.0",
    "psycopg[binary]>=3.3.4",
]

[project.urls]
Homepage = "https://github.com/eukos/mcp-sequel"

[project.scripts]
mcp-sequel = "mcp_sequel.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_sequel"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
